# `net`      from mkinitcpio-nfs-utils: brings up a link with klibc ipconfig
#            (DHCP), which is what Clevis and dropbear both need.
# `dropbear` from mkinitcpio-dropbear: installs the dropbear server, its host
#            keys and /etc/dropbear/root_key into the image.
# Order matters: the network must be up before dropbear starts listening.
HOOKS+=(net dropbear)
