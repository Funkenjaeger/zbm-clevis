# Build a HOST-GENERIC image: mkinitcpio's `autodetect` hook is deliberately
# NOT in HOOKS.
#
# Why: autodetect prunes modules by inspecting the running system's /sys and
# /proc. Inside the build container that is the BUILD host's hardware, not the
# target's. With autodetect enabled, an image built on machine A and booted on
# machine B loses exactly the drivers B needs (its NIC, its disk controller),
# and ZFSBootMenu comes up with no network -- or no pool. The cost of dropping
# it is size: roughly 100 MiB instead of roughly 62 MiB for a stock image.
HOOKS=(base udev modconf block filesystems keyboard)

# Belt and braces: force in the drivers we care about regardless of what
# add_checked_modules decides. EXTRA_MODULES comes from local.conf; leave it
# empty unless you know your target needs a module that is not pulled in.
#
# Only list modules that exist as .ko in the container's kernel. A driver
# compiled into the kernel (CONFIG_FOO=y) has no module file and mkinitcpio
# will fail on it -- that is not a problem, it is already in the kernel.
# shellcheck disable=SC1091
[ -r /build/local.conf ] && . /build/local.conf
# shellcheck disable=SC2206
MODULES+=(virtio_net virtio_pci virtio_blk virtio_scsi ${EXTRA_MODULES})
