# Clevis, the bare minimum needed for a `tang` (or `sss`-over-tang) decrypt.
# No systemd, no LUKS helpers, no TPM2: those pull in a lot and none of it is
# used by the ZFSBootMenu load-key hook.
#
#   clevis                dispatcher: `clevis decrypt` reads the JWE header
#                         and execs clevis-decrypt
#   clevis-decrypt        picks the pin named in the JWE and execs the matching
#                         clevis-decrypt-<pin>
#   clevis-decrypt-tang   the Tang pin (McCallum-Relyea); shells out to curl
#   clevis-decrypt-sss    the Shamir pin, used for t-of-n over several Tangs.
#                         In clevis 23 this one is an ELF binary linked against
#                         libjose/libjansson/libcrypto; add_binary resolves
#                         those with ldd, so nothing extra is needed.
#   clevis-decrypt-null   trivial pin; three bytes of image, and its absence
#                         turns a mis-typed policy into a confusing failure
#   jose                  the JOSE/JWE crypto CLI everything above calls
#   curl                  clevis-decrypt-tang's HTTP client
#   timeout               used by the hook to bound the whole decrypt
BINARIES+=(clevis clevis-decrypt clevis-decrypt-tang clevis-decrypt-sss clevis-decrypt-null jose curl timeout)

# Staged by rc.d/30-clevis before mkinitcpio runs.
#   clevis.jwe   the encrypted pool passphrase
#   timeout      the CLEVIS_TIMEOUT value, read by the hook at runtime
FILES+=(/etc/zbm-clevis/clevis.jwe /etc/zbm-clevis/timeout)
