# Sourced by zbm-builder.sh on the BUILD HOST (not inside the container) after
# it has resolved BUILD_DIRECTORY to an absolute path. Everything set here ends
# up as arguments to generate-zbm inside the container.

# local.conf lives beside this file in the staging directory build.sh assembles.
# shellcheck disable=SC1091
if [ -r "${BUILD_DIRECTORY}/local.conf" ]; then
  . "${BUILD_DIRECTORY}/local.conf"
fi

: "${NET_IFACE:=eth0}"
: "${EXTRA_KCL:=}"

# Packages installed into the build container before generate-zbm runs:
#   mkinitcpio-nfs-utils  the `net` hook (DHCP via klibc ipconfig)
#   mkinitcpio-dropbear   the `dropbear` hook
#   dropbear              the SSH server itself
#   clevis                clevis + clevis-decrypt* + the jose CLI
BUILD_ARGS+=( -p mkinitcpio-nfs-utils -p mkinitcpio-dropbear -p dropbear -p clevis )

# Write build products into the build directory's ./out
BUILD_ARGS+=( -o /build/out )

# Rewrite the command line from local.conf, so config.yaml stays static and
# estate-agnostic. yq is run inside the container against config.yaml.
_zct_kcl="zfsbootmenu ro quiet loglevel=4 net.ifnames=0 biosdevname=0 ip=:::::${NET_IFACE}:dhcp"
if [ -n "${EXTRA_KCL}" ]; then
  _zct_kcl="${_zct_kcl} ${EXTRA_KCL}"
fi
BUILD_ARGS+=( -e ".Kernel.CommandLine = \"${_zct_kcl}\"" )
unset _zct_kcl
